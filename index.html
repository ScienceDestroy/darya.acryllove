<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palette Creator by darya.acryllove</title>
<meta name="description" content="Palette Creator — конструктор выкрасок акриловых маркеров и трекеров раскрасок: точная печать в миллиметрах, готовые наборы маркеров, PDF.">
<meta property="og:title" content="Palette Creator by darya.acryllove">
<meta property="og:description" content="Конструктор выкрасок акриловых маркеров с точной печатью">
<meta name="theme-color" content="#f7f2ee">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎨</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Bad+Script&family=Caveat:wght@400;700&family=Comfortaa:wght@400;700&family=Cormorant:ital,wght@0,400;0,700;1,400&family=Dancing+Script:wght@400;700&family=Great+Vibes&family=Inter:ital,wght@0,400;0,700;1,400&family=Jost:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Manrope:wght@400;500;600;700;800&family=Marck+Script&family=Montserrat:ital,wght@0,400;0,500;0,700;1,400&family=Neucha&family=Nunito:ital,wght@0,400;0,700;1,400&family=Pacifico&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Rubik:ital,wght@0,400;0,700;1,400&family=Unbounded:wght@400;700&display=swap">
<style id="pageStyle">@page{size:210mm 297mm;margin:0}</style>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ============ приветствие ============ -->
<div id="welcome" class="welcome">
  <div class="welcome-inner">
    <div class="welcome-head">
      <div class="welcome-kicker">Palette Creator</div>
      <h1 class="welcome-logo">Твоя <span class="accent">палитра</span> маркеров</h1>
      <p class="welcome-tag">Выкраски и трекеры для акриловых маркеров — с точной печатью до миллиметра</p>
      <a class="welcome-by" href="https://www.instagram.com/darya.acryllove/" target="_blank" rel="noopener">by darya.acryllove</a>
    </div>
    <div class="welcome-cards">
      <button class="wcard" data-choose="strips">
        <span class="wcard-img" id="wPrevStrips"></span>
        <span class="wcard-body">
          <span class="wcard-title">Выкраска маркеров</span>
          <span class="wcard-desc">Ленточки с кодами, кружками под выкрас и отверстием под кольцо. Готовые наборы GuangNa и свои.</span>
          <span class="wcard-go">Создать выкраску →</span>
        </span>
      </button>
      <button class="wcard" data-choose="tracker">
        <span class="wcard-img" id="wPrevTracker"></span>
        <span class="wcard-body">
          <span class="wcard-title">Трекер раскрасок</span>
          <span class="wcard-desc">Лист с шапкой, клетками и отверстиями под дырокол. A4, A5, 2 или 4 страницы на листе, разделители.</span>
          <span class="wcard-go">Создать трекер →</span>
        </span>
      </button>
    </div>
    <button class="welcome-skip" id="welcomeSkip">Продолжить, где остановилась →</button>
  </div>
</div>

<!-- ============ шапка ============ -->
<header class="topbar">
  <button class="brand" id="btnHome" title="На главную">
    <span class="brand-mark">🎨</span>
    <span class="brand-text">Palette Creator<small>by darya.acryllove</small></span>
  </button>
  <div class="seg mode-seg" id="modeSeg">
    <button data-v="strips">Выкраска</button>
    <button data-v="tracker">Трекер</button>
  </div>
  <span class="spacer"></span>
  <button class="icon-btn" id="btnTheme" title="Светлая / тёмная тема">◐</button>
  <button class="btn ghost hide-sm" id="btnShare">Поделиться</button>
  <button class="btn ghost hide-sm" id="btnData">Файл</button>
  <button class="btn" id="btnPrint" title="Печать через браузер (Ctrl+P)">Печать</button>
  <button class="btn primary" id="btnPdf" title="PDF точно в размер листа — удобно с телефона">PDF</button>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <nav class="tabs" id="tabs"></nav>
    <div id="panes"></div>
  </aside>

  <main class="main" id="main">
    <div class="toolbar">
      <div class="zoomctl">
        <button class="icon-btn sm" id="zoomOut" title="Уменьшить">−</button>
        <button class="zoomval" id="zoomVal" title="100% — реальный размер на экране">70%</button>
        <button class="icon-btn sm" id="zoomIn" title="Увеличить">+</button>
        <button class="btn ghost sm" id="zoomFit">По ширине</button>
      </div>
      <span class="pageinfo" id="pageInfo"></span>
      <span class="cursor-mm" id="cursorMm"></span>
    </div>
    <div class="warns" id="warns"></div>
    <div class="sheet-wrap" id="sheetWrap"></div>
  </main>
</div>

<nav class="mobile-nav" id="mobileNav"></nav>

<!-- печать: сюда собираются страницы в точном размере (на экране скрыто) -->
<div id="printRoot" aria-hidden="true"></div>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileInput" style="display:none">

<!-- выезжающая панель: файл / импорт -->
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="dataDrawer" aria-hidden="true">
  <div class="drawer-head">
    <h3>Файл и обмен</h3>
    <button class="icon-btn" id="drawerClose" aria-label="Закрыть">✕</button>
  </div>
  <div class="drawer-links">
    <button class="btn wide" id="drShare">🔗 Поделиться ссылкой</button>
    <button class="btn wide" id="drExport">⇩ Сохранить проект (JSON)</button>
    <button class="btn wide" id="drOpen">⇧ Открыть проект из файла</button>
  </div>
  <div class="drawer-sep"></div>
  <p class="hint">Или вставьте JSON проекта или ссылку/код после <b>#p=</b>. Текущие маркеры и настройки будут заменены.</p>
  <textarea id="drawerText" spellcheck="false" placeholder="Вставьте JSON или ссылку…"></textarea>
  <button class="btn primary wide" id="drawerImport" style="margin-top:10px">Импортировать</button>
</aside>

<!-- модальное окно -->
<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <div class="foot" id="modalFoot"></div>
  </div>
</div>

<script src="js/presets.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
